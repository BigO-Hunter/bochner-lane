name: Lean proof

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  bochner-lane:
    name: Build BochnerLane (includes CheckAxioms)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out the proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The default target BochnerLane globs BochnerLane.+, so the build also
      # elaborates BochnerLane/CheckAxioms.lean (the #print axioms audit file).
      - name: Install Lean and cached Mathlib dependencies, build the proof
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: .
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
